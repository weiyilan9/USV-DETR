[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "usvdetr"
description = "USV-DETR: high-resolution detection of rodent ultrasonic vocalizations"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
dynamic = ["version"]

# The model definition itself comes from the upstream RT-DETRv4 repository,
# which is not on PyPI and is therefore not listed here. Only load_model
# needs it, and it is imported lazily, so the rest of the package works
# without it. See the README for the clone step.
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "pandas>=1.4",
    "soundfile>=0.11",
    "matplotlib>=3.5",
    "opencv-python>=4.6",
    "openpyxl>=3.0",
    "torch>=2.0",
    "torchvision>=0.15",
]

[project.optional-dependencies]
# Extras for running demo/demo.ipynb, which pulls weights from HuggingFace.
demo = [
    "huggingface_hub>=0.20",
    "jupyter>=1.0",
]

[project.scripts]
usvdetr-detect = "usvdetr.cli:main"

[project.urls]
Repository = "https://github.com/weiyilan9/USV-DETR"

[tool.setuptools]
packages = ["usvdetr"]

[tool.setuptools.dynamic]
version = { attr = "usvdetr.__version__" }
